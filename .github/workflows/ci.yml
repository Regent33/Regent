name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workspace vendors or-core/or-mcp in-repo (ADR-032), so Regent builds
# standalone — no sibling checkout and no repo variables needed.

jobs:
  rust:
    name: rust — fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show # installs the channel + components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Format
        run: cargo fmt --all -- --check
      # regent-voice-server pulls sherpa-onnx, whose bindgen needs LLVM/libclang,
      # and it is excluded from release binaries — skip it here so CI needs no
      # native speech toolchain. `cargo fmt --all` above still covers its source.
      - name: Clippy
        run: cargo clippy --workspace --exclude regent-voice-server --all-targets
      # A failure here used to say only "Process completed with exit code 101"
      # to anyone who could not open the raw log — and the raw log needs
      # repo-scoped auth, while a check-run ANNOTATION is public. So on failure
      # the panic blocks and the failing test names are re-emitted as
      # annotations: they show on the run page without expanding anything, and
      # they are readable through the API. Two review rounds were spent guessing
      # at a red Test step that could have named itself.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # --no-fail-fast: without it cargo stops at the first failing target,
          # so a red job says nothing about every target sorting after it and
          # each fix costs another full round trip to discover the next one.
          if cargo test --workspace --exclude regent-voice-server --no-fail-fast 2>&1 | tee test-output.txt; then
            exit 0
          fi
          # From the first `---- <test> stdout ----` to the end covers both the
          # panic text and the trailing `failures:` list. Capped so a suite that
          # fails wholesale cannot flood the annotation limit.
          awk '/^---- /,0' test-output.txt | head -100 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit 1

  supply-chain:
    name: supply-chain — cargo + js advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit advisories (RUSTSEC)
        # ACCEPTED: RUSTSEC-2023-0071 — rsa Marvin timing sidechannel, no fixed
        # release upstream. Owner: @Regent33. Review by: 2026-10-31.
        # Compensating control: the `rsa` crate is a transitive dependency of the
        # SSH terminal backend only; Regent performs no RSA operation on
        # attacker-supplied ciphertext, which is what the sidechannel requires.
        # Re-check at review time — if a fixed release exists, drop the ignore.
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Deny (advisories · licenses · sources)
        run: cargo deny check

      # The JS half of the supply chain. Until now nothing scanned it: 52 direct
      # npm deps across four workspaces, four bun lockfiles, all unaudited. The
      # first run of this found a high React Router CSRF advisory in the shipped
      # desktop app and 13 advisories in the web surface.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Audit CLI dependencies
        working-directory: src/regent-cli
        # ACCEPTED: GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq — image-size
        # DoS via infinite loops in its ICNS / JXL / HEIF parsers, reached
        # through pptxgenjs. There is NO fixed version to move to: the latest
        # published image-size is 2.0.2 and both advisories cover <=2.0.2, and
        # pptxgenjs@4.0.1 pins ^1.2.1 regardless.
        # Owner: @Regent33. Review by: 2026-11-30.
        # Compensating control: pptxgenjs never invokes the vulnerable parsers.
        # Its only `sizeOf()` call site sits inside a function commented out in
        # dist and marked "FIXME: TODO: currently unused" (pptxgen.cjs.js:5018),
        # so image-size is a declared dependency with no live call path. Regent
        # additionally passes images as base64 PNG data it builds itself
        # (features/documents/runtime/slideElements.ts:129), never a file path,
        # so no attacker-supplied ICNS/JXL/HEIF file reaches a parser.
        run: bun audit --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq
      - name: Audit Desktop dependencies
        working-directory: src/regent-app/Desktop
        # ACCEPTED: GHSA-qwww-vcr4-c8h2 — React Router RSC-mode CSRF bypass,
        # affects >=7.12.0 <8.3.0; the fix is a MAJOR bump (7 -> 8) with
        # migration work, which is an owner decision, not a patch.
        # Owner: @Regent33. Review by: 2026-10-31.
        # Compensating control: the advisory requires React Router's RSC mode.
        # Desktop is a Tauri app using the router purely for client-side
        # navigation (ADR-034) — there is no server, no action endpoint, and no
        # RSC route for a cross-site request to reach.
        run: bun audit --ignore GHSA-qwww-vcr4-c8h2
      - name: Audit Installer dependencies
        working-directory: src/regent-app/Installer
        run: bun audit
      - name: Audit web dependencies
        working-directory: src/regent-web
        run: bun audit

  cli:
    name: cli — typecheck · lint · compile · test
    # Both OSes: the shell contract (exit codes, stream discipline, TTY
    # detection) is what the compiled binary does on the user's platform, and
    # Windows is the primary development host.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/regent-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx biome check src
      # Compile BEFORE the tests: the `*.int.test.ts` suites black-box the built
      # artefact and skip themselves when it is missing. Compiling afterwards
      # meant they had never once run in CI.
      - name: Compile (single binary)
        run: bun run compile
      # `regent setup` (and providers/mom/voice) write config.yaml by spawning
      # `regent-deacon config set` — the one validated, locked, atomic writer —
      # so their integration tests need the Rust binary or they skip green.
      # Linux only: the code under test is platform-independent, so proving it
      # once per run is enough, and a cold Rust build on the Windows runner
      # would cost far more than it protects.
      - name: Install pinned toolchain
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: rustup show
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: runner.os == 'Linux'
      - name: Build regent-deacon (for the config-write tests)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: cargo build -p regent-deacon
      - name: Test
        # Set only where the deacon was built: the suite FAILS rather than skips
        # if it is missing, so a broken build cannot pass as "no tests to run".
        env:
          REGENT_CI_EXPECT_DEACON: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bun test

  desktop:
    name: desktop — typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/regent-app/Desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Bun is canonical for this package (no package-lock.json); the frozen
      # lockfile guards against silent dependency drift on CI.
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
      # Runs `tsc --noEmit && vite build` — the Vite production bundle the
      # Tauri shell ships, catching build-time regressions the typecheck can't.
      - name: Build
        run: bun run build

  parity:
    name: parity — version · protocol drift
    # Runs on both OSes so a cross-language/line-ending regression in the copied
    # version and call-protocol constants fails before merge (ADR-041 Phase 0).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # Derives the canonical workspace version + voice-server call protocol and
      # asserts every hand-copied surface matches — no hard-coded expected value.
      - name: Version + protocol parity
        run: python scripts/tests/verify-versions.py
      # The managed-key catalog is hand-copied into TypeScript for the offline
      # CLI. A drift means `regent keys set X` succeeds while the app never
      # shows X (or the reverse) — five keys had already landed in different
      # sections depending on which surface you opened.
      - name: Managed-key catalog parity (CLI vs deacon/app)
        run: python scripts/tests/verify-key-catalog.py
      # Exercises the real manifest generator + parity logic against fixtures.
      - name: Release-tool unit tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  scripts:
    name: scripts — install/uninstall verification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # POSIX side: syntax-check both scripts, then exercise the real verified-
      # download and offline branches against local fixtures and scratch homes.
      - name: POSIX install scripts (syntax + verification)
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh scripts/tests/verify-install.sh
      # Windows side: the same offline-install + uninstall pin-decision checks,
      # under Windows PowerShell 5.1 — the interpreter the `irm | iex` one-liner
      # actually runs. Exercises install.ps1 / uninstall.ps1 without HKCU or PATH.
      - name: Windows install scripts (verification)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-install.ps1

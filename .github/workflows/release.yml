# Builds the release assets the one-line installers download
# (scripts/install.sh / install.ps1): regent-cli + regent-deacon per OS/arch,
# packaged as regent-<os>-<arch>.{tar.gz,zip}. Runs on version tags.
name: release

on:
  push:
    tags: ["v*"]
  # Backfill path: rebuild the assets and upload them to an existing release —
  # for when a tag's run died on a workflow bug (v0.1.1 queued forever on the
  # retired macos-13 label) without minting a new version.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the assets to"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x86_64
          - runner: macos-latest
            os: macos
            arch: aarch64
          # Intel macOS is DROPPED, and the runner was never the reason.
          # v0.1.1 asked for the retired `macos-13` label and queued forever;
          # v0.1.2 moved to `macos-15-intel`, which ran fine and then failed to
          # BUILD — exit 101, taking the `manifest` fan-in down with it via
          # `needs: build`. The cause is upstream and permanent: the agent core
          # embeds ONNX Runtime via ort-sys 2.0.0-rc.12, which publishes no
          # prebuilt for x86_64-apple-darwin, because ONNX Runtime itself
          # stopped shipping x86_64 macOS binaries (Apple stopped selling Intel
          # Macs in 2023). Building ORT from source per release for a platform
          # its own vendor has abandoned is not a trade worth making.
          # Nothing is lost that users had: no Regent release — 0.1.0, 0.1.1 or
          # 0.1.2 — has ever carried a macos-x86_64 asset. `scripts/install.sh`
          # now says so outright instead of falling through to a source build
          # that fails the same way.
          #
          # Verbatim, from the v0.1.2 job log rather than inferred:
          #   ort-sys@2.0.0-rc.12: can't do xcframework linking for target
          #     'x86_64-apple-darwin'
          #   ort-sys@2.0.0-rc.12: ort does not provide prebuilt binaries for
          #     the target `x86_64-apple-darwin` with feature set (no features).
          #   error: build script logged errors
          #
          # Restoring this leg means changing the backend, not the runner label.
          # ort's own error names the option: `ort-tract`, a pure-Rust ONNX
          # backend with no prebuilt to be missing. That is a swap affecting
          # embedding behaviour on EVERY platform (and fastembed pins ort), so
          # it is a deliberate choice to measure, not a CI edit.
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Backfills must build the requested tag, never the selected branch.
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Both builds re-emit their own failure as check ANNOTATIONS. A raw
      # Actions log needs repo-scoped auth even on a public repo, so a red
      # matrix leg otherwise reports "Process completed with exit code 101" and
      # nothing else — which is exactly how the v0.1.2 macOS x86_64 failure
      # arrived, with no way to tell a missing prebuilt from a code error
      # without minting another tag. `awk '/^error/,0'` takes everything from
      # the first error line to the end, so a build script's `--- stderr` block
      # comes along with it.
      - name: Build deacon (release)
        shell: bash
        run: |
          set -o pipefail
          if cargo build --release -p regent-deacon 2>&1 | tee deacon-build.log; then exit 0; fi
          # Tail, not a pattern — same reason as the voice server step below:
          # a failure that isn't a cargo `error:` line would print nothing.
          tail -60 deacon-build.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit 1

      - name: Build CLI
        working-directory: src/regent-cli
        shell: bash
        run: |
          set -o pipefail
          if { bun install --frozen-lockfile && bun run compile; } 2>&1 | tee cli-build.log; then exit 0; fi
          tail -40 cli-build.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit 1

      # The mic and Butler Mode spawn `regent-voice-server`, and it was never
      # built or packaged here — so local voice has never worked on an
      # installed machine, on any release: the app reported "regent-voice-server
      # binary not found" and there was nothing to find. sherpa-onnx ships
      # prebuilt libs (no cmake, see ADR-029) but bindgen still runs, and
      # libclang is the reason this needs more than another `-p` flag.
      # LIBCLANG_PATH must be set as a REAL environment variable on every
      # runner, because `.cargo/config.toml` carries a Windows one for local
      # builds and cargo applies `[env]` on all platforms. It does not override
      # an already-set variable, so exporting the true path here wins — without
      # it, linux and macos inherited "C:\Program Files\LLVM\bin" and failed
      # with "Unable to find libclang" while Windows built fine.
      - name: libclang for bindgen (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # LOOK FIRST, install second: the runner already ships LLVM, and the
          # previous version led with `apt-get update && apt-get install`, which
          # failed and took the step with it under bash's -e — reporting nothing
          # but "exit code 1" because it died before any of its own diagnostics.
          set +e
          find_libclang() {
            find /usr/lib /usr/local/lib -name 'libclang*.so*' 2>/dev/null | head -1
          }
          lib="$(find_libclang)"
          if [ -z "$lib" ]; then
            sudo apt-get update >apt.log 2>&1
            sudo apt-get install -y libclang-dev >>apt.log 2>&1 ||
              tail -4 apt.log | while IFS= read -r l; do printf '::error::apt: %s\n' "$l"; done
            lib="$(find_libclang)"
          fi
          if [ -z "$lib" ]; then
            printf '::error::%s\n' "no libclang anywhere under /usr/lib or /usr/local/lib"
            printf '::error::%s\n' "llvm dirs present: $(ls -d /usr/lib/llvm* 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
          echo "libclang: $lib"
      - name: libclang for bindgen (macos)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          # Xcode ships libclang.dylib, just not somewhere bindgen looks.
          dir="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ ! -f "$dir/libclang.dylib" ]; then
            echo "::error::no libclang.dylib under $dir"
            exit 1
          fi
          echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"
          echo "libclang: $dir/libclang.dylib"
      - name: libclang for bindgen (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build voice server (release)
        shell: bash
        run: |
          set -o pipefail
          echo "disk before: $(df -h . | tail -1)"
          if cargo build --release -p regent-voice-server 2>&1 | tee voice-build.log; then exit 0; fi
          # GitHub keeps only ~10 annotations per step, so WHAT is emitted
          # matters more than how much. `awk '/^error/,0'` printed nothing at
          # all (it matches cargo's `error:` lines, and sherpa-rs fails inside
          # bindgen's BUILD SCRIPT); a plain `tail -60` then spent the whole
          # budget on "Compiling …" progress and truncated the part that said
          # why. Error-shaped lines first, then the real tail, capped to fit.
          {
            grep -Ei 'error|cannot|failed|no space|killed|signal|fatal' voice-build.log | tail -6
            echo "--- last lines ---"
            tail -3 voice-build.log
            echo "disk after: $(df -h . | tail -1)"
          } | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit 1

      - name: Package (unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p pkg
          cp target/release/regent-deacon src/regent-cli/dist/regent-cli \
             target/release/regent-voice-server pkg/
          asset="regent-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" -C pkg .
          # Per-asset checksum, generated in the SAME job as the archive and
          # uploaded beside it — the one-line installers download <asset>.sha256
          # and refuse to install on a mismatch. sha256sum on Linux; macOS ships
          # only shasum. Same %-agnostic bare-hash form on both.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/release/regent-deacon.exe, src/regent-cli/dist/regent-cli.exe, target/release/regent-voice-server.exe pkg/
          $asset = "regent-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path pkg/* -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            regent-*.tar.gz
            regent-*.zip
            regent-*.sha256

      # Stash this run's archive + sidecar so the manifest fan-in reads *this
      # run's* bytes — never assets left on the release by a different run.
      - name: Stash assets for the manifest fan-in
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-asset-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            regent-*.tar.gz
            regent-*.zip
            regent-*.sha256
          if-no-files-found: error

  # Fan-in: runs only after every matrix asset + sidecar exists, then publishes
  # one canonical manifest (component/protocol/schema facts + per-platform name,
  # size, SHA-256; no URLs). Phase 0 is unsigned — signing_key_id is null.
  manifest:
    name: manifest — canonical release fan-in
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Download this run's release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: run-assets
          pattern: release-asset-*
          merge-multiple: true
      - name: Build the canonical release manifest
        run: python scripts/release/make-manifest.py run-assets regent-manifest.json
      - name: Upload the manifest to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: regent-manifest.json
